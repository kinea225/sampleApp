<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>모로우 — 앱 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --beige:#F2F2F2;
  --sand:#FFFFFF; --taupe:#FFFFFF; --blush:#FFFFFF; --warm:#FFFFFF;
  --accent:#111111; --accent-deep:#111111; --ink:#111111; --ink-2:#555555; --ink-3:#8C8C8C;
  --line:#111111; --focus:#111111; --mark:#E6E6E6;
  --font:'DM Sans','Noto Sans KR',system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.8;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ── 앱 셸 ── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--accent-deep)}
.logo svg{width:28px;height:28px}
.workspace{font-size:11px;color:var(--ink-2);background:var(--beige);border-radius:8px;padding:8px 10px;line-height:1.5}
.workspace b{display:block;color:var(--ink);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px;text-align:left;width:100%}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--beige)}
.nav button[aria-current=page]{background:var(--beige);color:var(--accent-deep);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav .count{margin-left:auto;font-size:10px;background:var(--accent-deep);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.side-add{margin-top:auto;border:1px dashed #111111;border-radius:12px;padding:12px;font-size:11.5px;color:var(--ink-2);line-height:1.6}
.side-add .btn{margin-top:8px;width:100%}
.user{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2);line-height:1.4}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sand);display:grid;place-items:center;color:var(--accent-deep);font-weight:700;font-size:12px}
.user b{display:block;color:var(--ink);font-size:12.5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.crumb{font-size:12px;color:var(--ink-3)}
.crumb b{color:var(--ink);font-weight:500}
.content{display:grid;grid-template-columns:minmax(0,640px) 264px;gap:32px;justify-content:center;padding:26px 28px 80px;width:100%;max-width:1040px;margin:0 auto}
.content.single{grid-template-columns:minmax(0,640px)}
.col{min-width:0;display:flex;flex-direction:column;gap:18px}
.page-title{font-size:27px;line-height:1.35;letter-spacing:-.02em;font-weight:700}
.page-sub{color:var(--ink-2);font-size:13px;margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;background:var(--accent-deep);color:#fff;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:#333333}
.btn svg{width:15px;height:15px}
.btn.ghost{background:var(--surface);color:var(--accent-deep);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--beige)}
.btn.small{min-height:30px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed=true]{background:var(--beige);border-color:var(--accent);color:var(--accent-deep);font-weight:700}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
.notice svg{width:34px;height:34px;flex:none}
.notice b{color:var(--ink);display:block;font-size:13.5px}
.status{background:#F7F7F7;border:1px solid #111111;border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.status.err{background:#FDECEA;border-color:#B3261E}
.status button{margin-left:auto;color:var(--ink-2);font-size:12px;text-decoration:underline;flex:none}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;background:var(--beige);border-radius:9px;padding:3px;gap:2px}
.tabs button{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--ink-2);min-height:30px}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--accent-deep);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.search{flex:1 1 180px;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px;min-height:36px}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:13px}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);min-height:28px}
.chip[aria-pressed=true]{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}

/* ── 지식 카드(덱) ── */
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.deck-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10px;letter-spacing:.04em;color:var(--ink-3)}
.tag{font-size:10px;padding:1px 8px;border-radius:10px;background:var(--beige);color:var(--accent-deep);font-weight:500;letter-spacing:0}
.tag.line{background:none;border:1px solid var(--line);color:var(--ink-2)}
.tag.due{background:var(--accent-deep);color:#fff}
.deck h2{font-size:19px;line-height:1.45;letter-spacing:-.01em}
.deck-sum{font-size:12.5px;color:var(--ink-2)}
.banner{background:var(--beige);border-radius:10px;padding:10px 12px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 200px}
.stage{max-width:420px;width:100%;margin:0 auto;touch-action:pan-y;container-type:inline-size}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;max-width:420px;width:100%;margin:0 auto}
.pager .pg{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--accent-deep)}
.pager .pg:hover{background:var(--beige)}
.pager .pg[disabled]{opacity:.35;cursor:default}
.pager .pg svg{width:16px;height:16px}
.dots{flex:1;display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent-deep);width:16px;border-radius:3px}
.count-n{font-size:11px;color:var(--ink-3);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--ink-3);min-height:26px}
.ref{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--accent-deep);background:var(--surface);min-height:24px}
.ref:hover{background:var(--beige)}
.supp{font-size:10.5px;border:1px dashed var(--accent);color:var(--accent-deep);border-radius:6px;padding:1px 8px}
.deck-actions{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.deck-actions .sp{flex:1}
.memo{font-size:11.5px;color:var(--ink-2)}

/* 글 보기 */
.reading{display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:1.9}
.reading section{border-left:2px solid var(--line);padding-left:12px}
.reading h3{font-size:14px}
.reading .k{font-size:10px;color:var(--ink-3);letter-spacing:.05em}
.reading ul,.reading ol{margin:4px 0;padding-left:18px}
.reading blockquote{margin:4px 0;color:var(--ink-2)}

/* ── 카드 면(4:5) ── */
.face{aspect-ratio:4/5;border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:5cqw;background:var(--sand);border:1px solid #111111}
.face.t-읽기{background:var(--taupe)} .face.t-발견{background:var(--blush)} .face.t-기타{background:var(--warm)}
.fh{display:flex;align-items:center;gap:1.6cqw;font-size:clamp(9px,2.5cqw,11px);letter-spacing:.06em;color:var(--accent-deep);margin-bottom:2.6cqw;flex:none}
.fh .ic{width:4.6cqw;height:4.6cqw;min-width:14px;min-height:14px}
.fh .n{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fb{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.6cqw}
.ft{font-size:clamp(17px,6.2cqw,28px);line-height:1.34;letter-spacing:-.02em;font-weight:700;flex:none}
.ft.sm{font-size:clamp(14px,4.4cqw,19px)}
.fp{font-size:clamp(11.5px,3.5cqw,15px);line-height:1.85;color:#333333}
.scroll{overflow-y:auto;min-height:0;scrollbar-width:thin}
.char{height:100%;width:auto}
.bubble{position:relative;background:#fff;border:1.5px solid var(--accent-deep);border-radius:3.4cqw;padding:1.6cqw 2.6cqw;font-size:clamp(10.5px,3.2cqw,14px);line-height:1.55;color:var(--ink);max-width:94%}
.bubble::after{content:'';position:absolute;bottom:-1.5cqw;left:5cqw;width:2.4cqw;height:2.4cqw;background:#fff;border-right:1.5px solid var(--accent-deep);border-bottom:1.5px solid var(--accent-deep);transform:rotate(45deg)}
.bubble.right::after{left:auto;right:5cqw}
.bubble.up::after{bottom:auto;top:-1.5cqw;transform:rotate(225deg)}

/* 웹툰 */
.comic{flex:1;min-height:0;display:grid;gap:2cqw;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr)}
.comic.n2{grid-template-columns:1fr}
.comic.n3 .panel:first-child{grid-column:1/-1}
.panel{border:2px solid var(--accent-deep);border-radius:2cqw;background:var(--surface);padding:2cqw;display:flex;flex-direction:column;gap:1.4cqw;min-height:0;position:relative;overflow:hidden}
.panel .cap{align-self:flex-start;font-size:clamp(8.5px,2.4cqw,11px);line-height:1.4;background:var(--beige);color:var(--ink-2);padding:.2em .7em;border-radius:1cqw;flex:none}
.panel .say{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;overflow-y:auto;padding-bottom:1.6cqw}
.panel .bubble{align-self:flex-start}
.panel.r .bubble{align-self:flex-end}
.panel .who{flex:0 0 46%;min-height:0;display:flex}
.panel.r .who{justify-content:flex-end}
.panel.wide{flex-direction:row;align-items:stretch}
.panel.wide .cap{position:absolute;top:2cqw;left:2cqw}
.panel.wide .who{flex:0 0 34%;align-items:flex-end;order:-1}
.panel.wide.r .who{order:2}
.panel.wide .say{justify-content:center;padding:6cqw 1cqw 0}
.panel.wide .bubble::after{bottom:auto;top:calc(50% - 1.2cqw);left:-1.4cqw;transform:rotate(135deg)}
.panel.wide.r .bubble::after{left:auto;right:-1.4cqw;transform:rotate(-45deg)}

/* 장면 */
.scene{flex:1;min-height:0;position:relative;border-radius:3cqw;overflow:hidden;background:var(--surface);border:1px solid #111111;display:flex;flex-direction:column}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.scene .narr{position:relative;margin:3cqw;background:rgba(255,255,255,.94);border-left:3px solid var(--accent);border-radius:1.6cqw;padding:2cqw 3cqw;max-height:46%;overflow-y:auto}
.scene .act{position:relative;margin-top:auto;display:flex;align-items:flex-end;gap:2cqw;padding:0 3cqw;height:46%}
.scene .act .who{height:100%;flex:none}
.scene .act .bubble{margin-bottom:12cqw;align-self:flex-end;max-height:80%;overflow-y:auto}
.scene .act .bubble::after{bottom:4cqw;left:-1.4cqw;transform:rotate(135deg)}
.split{flex:1;min-height:0;display:flex;flex-direction:column;gap:3cqw}
.split .pic{flex:0 0 40%;position:relative;border-radius:3cqw;overflow:hidden;background:var(--surface);border:1px solid #111111;display:flex;align-items:flex-end;justify-content:center}
.split .pic .bg{position:absolute;inset:0;width:100%;height:100%}
.split .pic .who{position:relative;height:88%}
.split .txt{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.4cqw}
.split .txt .bubble{align-self:flex-start}
.split .txt .bubble::after{display:none}

/* 리액션 */
.react{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2cqw}
.react .lines{position:absolute;inset:-12cqw;width:auto;height:auto;opacity:.5}
.react .badge{position:relative;background:var(--accent-deep);color:#fff;font-size:clamp(9px,2.6cqw,12px);padding:.25em 1em;border-radius:3cqw;transform:rotate(-3deg);letter-spacing:.06em}
.react .close{position:relative;width:52%;aspect-ratio:1;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent-deep);overflow:hidden;flex:none;display:grid;place-items:center}
.react .close svg{width:150%;height:auto;margin-top:34%}
.react .ft{position:relative;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 .2em}
.react .bubble{position:relative}
.react .bubble.up::after{left:calc(50% - 1.2cqw)}
.react .dotdot{position:relative;font-size:6cqw;letter-spacing:.3em;color:var(--accent);line-height:1}

/* 인포그래픽 */
.cmp{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;position:relative}
.cmp .side-c{background:var(--surface);border-radius:3cqw;padding:3cqw;display:flex;flex-direction:column;gap:1.6cqw;min-height:0;overflow-y:auto;border:1.5px solid var(--accent-deep)}
.cmp .side-c.b{background:#F7F7F7;border-style:dashed}
.cmp .lb{font-weight:700;font-size:clamp(12px,3.9cqw,17px);line-height:1.35;border-bottom:2px solid var(--mark);padding-bottom:1cqw}
.cmp .side-c.b .lb{border-color:var(--accent);padding-left:3.4cqw}
.cmp li{font-size:clamp(10.5px,3.1cqw,13.5px);line-height:1.65;list-style:none;padding-left:1em;position:relative}
.cmp li::before{content:'';position:absolute;left:0;top:.7em;width:.4em;height:.4em;border-radius:50%;background:var(--accent)}
.cmp ul{margin:0;padding:0;display:flex;flex-direction:column;gap:1cqw}
.cmp .vs{position:absolute;left:50%;top:7cqw;transform:translate(-50%,-50%);width:8.4cqw;height:8.4cqw;min-width:26px;min-height:26px;border-radius:50%;background:var(--accent-deep);color:#fff;font-size:clamp(8px,2.5cqw,11px);font-weight:700;display:grid;place-items:center;z-index:1}
.steps{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:3cqw;position:relative;padding-bottom:3.4cqw}
.steps li:last-child{padding-bottom:0}
.steps .num{width:7.6cqw;height:7.6cqw;min-width:24px;min-height:24px;border-radius:50%;background:var(--accent-deep);color:#fff;font-weight:700;font-size:clamp(10px,3.1cqw,14px);display:grid;place-items:center;position:relative;z-index:1}
.steps li:not(:last-child)::before{content:'';position:absolute;left:calc(max(12px,3.8cqw) - 1px);top:7cqw;bottom:0;width:2px;background:repeating-linear-gradient(var(--accent) 0 4px,transparent 4px 8px)}
.steps li:not(:last-child)::after{content:'';position:absolute;left:calc(max(12px,3.8cqw) - 4px);bottom:.4cqw;border:4px solid transparent;border-top-color:var(--accent);border-bottom:0}
.steps .box{background:var(--surface);border-radius:2.4cqw;padding:1.6cqw 3cqw;font-size:clamp(11px,3.3cqw,14.5px);line-height:1.6;border:1px solid #111111}
.steps .box small{display:block;color:var(--ink-2);font-size:.88em}

/* 타이포그래피 · 요약 */
.typo{flex:1;min-height:0;display:flex;flex-direction:column;gap:3cqw;justify-content:center}
.typo.alt{justify-content:flex-end}
.typo .qm{font-size:17cqw;line-height:.6;color:var(--accent);font-family:Georgia,serif;height:8cqw;flex:none}
.typo blockquote{margin:0;font-size:clamp(15px,5.1cqw,23px);line-height:1.6;font-weight:700;letter-spacing:-.015em}
.typo blockquote span{background:linear-gradient(transparent 60%,var(--mark) 60%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.typo.alt blockquote{border-left:4px solid var(--accent-deep);padding-left:3.4cqw}
.typo .kt{font-size:clamp(10px,2.9cqw,13px);color:var(--accent-deep);font-weight:700;letter-spacing:.02em}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2.2cqw;flex:1;min-height:0;overflow-y:auto}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:2.4cqw;background:var(--surface);border-radius:2.4cqw;padding:2cqw 3cqw;font-size:clamp(11px,3.3cqw,14.5px);line-height:1.6;border:1px solid #111111}
.checks .ck{width:5cqw;height:5cqw;min-width:16px;min-height:16px;margin-top:.25em;color:var(--accent-deep)}
.sumbadge{align-self:flex-start;background:var(--accent-deep);color:#fff;font-size:clamp(9px,2.6cqw,12px);padding:.2em 1em;border-radius:3cqw;letter-spacing:.06em}
.fallback-note{position:absolute;right:3cqw;bottom:2cqw;font-size:9px;color:var(--ink-3);background:rgba(255,255,255,.85);border-radius:4px;padding:0 5px}

/* ── 보조 열 ── */
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:76px;align-self:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{font-size:12px;color:var(--ink-2);font-weight:500;margin-bottom:8px;letter-spacing:.02em}
.big{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.big small{font-size:12px;color:var(--ink-3);font-weight:400}
.bar{height:6px;background:var(--beige);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.mini button{text-align:left;color:var(--ink);width:100%;display:flex;gap:6px;line-height:1.5}
.mini button:hover{color:var(--accent-deep);text-decoration:underline}
.mini small{color:var(--ink-3);margin-left:auto;flex:none;font-size:11px}
.empty{background:var(--surface);border:1px dashed #111111;border-radius:12px;padding:28px 20px;text-align:center;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:54px;height:54px}
.empty b{color:var(--ink);font-size:14.5px}

/* ── 설정 ── */
.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.set h2{font-size:15px}

<body>
<div id="root"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   모로우 앱 프로토타입 — 카드뉴스 생성 파이프라인 (plan.md SRS v2.0)
   모듈: ① Source Analyzer → ② Planner → ③ Validator → ④ Asset Resolver → ⑤ Renderer
   모든 모듈은 서로의 내부를 모르고, 아래 데이터 계약(JSON)만 주고받는다.
   ═══════════════════════════════════════════════════════════════════ */
const CARD_TYPES = ['scene','comic','reaction','infographic','text','summary'];
const CARD_ROLES = ['hook','context','explanation','example','comparison','reaction','conclusion'];

/* ── ① Source Analyzer (FR-01~05) ─────────────────────────────── */
const STOP = new Set('것은 것이 것을 것도 수는 수가 때는 때문에 등의 그리고 그러나 하지만 또한 때문 위해 대한 통해 경우 있다 없다 한다 된다 이다 있는 하는 되는 이런 그런 모든 어떤 우리 여기 이것 그것 것이다 가장 매우 다시 바로 먼저 다음 다음으로 마지막 마지막으로 예를 들어 반면 이후 내용 설명 문단 부분 정도 사용 방식 방식이다 the and for that with this are was'.split(' '));
const LIST_LINE = /^\s*(\d+[.)]|[-*•·]|[①-⑩]|\d+단계[.:]?)\s*/;

function normalizeText(raw){
  return String(raw).replace(/\r\n?/g,'\n')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F​﻿]/g,'')
    .replace(/\t/g,' ').replace(/[  ]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function splitSentences(text){
  return String(text).split(/(?<=[.!?。…])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
}
function splitParagraphs(text){
  let paras = text.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);
  if (paras.length===1 && paras[0].includes('\n')){
    const lines = paras[0].split('\n').filter(Boolean);
    const lists = lines.filter(l=>LIST_LINE.test(l)).length;
    if (lists < lines.length/2 && lines.every(l=>l.length>40)) paras = lines;
  }
  const out=[]; let carry='';
  for (const p of paras){
    const c = p.replace(/^#{1,6}\s*/gm,'');
    // 제목처럼 짧은 조각은 버리지 않고 다음 문단 앞에 붙인다
    if (c.length<25 && !/[.!?]$/.test(c) && !c.includes('\n')){ carry = carry? carry+' '+c : c; continue; }
    const full = carry? carry+'\n'+c : c; carry='';
    if (full.length<=420) out.push(full);
    else { let buf='';
      for (const s of splitSentences(full)){
        if (buf && (buf+' '+s).length>320){ out.push(buf); buf=s; } else buf = buf? buf+' '+s : s;
      }
      if (buf) out.push(buf);
    }
  }
  if (carry) out.push(carry);
  return out;
}
function extractKeywords(text, limit=6){
  const f=new Map();
  for (const raw of (text.match(/[가-힣A-Za-z][가-힣A-Za-z0-9]+/g)||[])){
    let w=raw;
    if (/[가-힣]/.test(w) && w.length>2) w=w.replace(/(으로써|으로서|에서는|에서|에게|으로|이라는|라는|이란|이며|이고|하고|하며|하는|한다|했다|된다|되는|이다|입니다|합니다|은|는|이|가|을|를|의|에|도|로|과|와|만|란)$/,'');
    if (w.length<2 || STOP.has(w.toLowerCase())) continue;
    if (/[가-힣]/.test(w) && (/(다|수록|지만|면서|으며|ㄴ다)$/.test(w) || (w.length>=3 && /(고|서|게|지|며|던|어|아|여|해|된|한|할|될|는|은)$/.test(w)))) continue;
    f.set(w,(f.get(w)||0)+1);
  }
  return [...f.entries()].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).slice(0,limit).map(e=>e[0]);
}
function analyzeSource(source){
  const text = normalizeText(source.text);
  const chunks = splitParagraphs(text).map((t,i)=>({id:`${source.id}-p${i+1}`,index:i+1,text:t}));
  const keywords = extractKeywords(source.title+' '+text);
  const sents = splitSentences(text);
  const avg = sents.length? text.length/sents.length : 0;
  const jargon = (text.match(/[A-Za-z]{3,}/g)||[]).length;
  const dens = text.length? jargon*10/text.length : 0;
  const lists = text.split('\n').filter(l=>LIST_LINE.test(l)).length;
  const procedural = lists>=3 || /레시피|조리법|재료|준비물|설치 방법|매뉴얼|사용 설명서|따라 하기/.test(source.title+' '+text);
  const comparative = (text.match(/반면|반대로|[와과] 달리|에 비해|차이점|vs\.?/gi)||[]).length>=2;
  return {
    sourceId:source.id, title:source.title, chunks,
    topic:(source.title||'').trim()||keywords[0]||'제목 없는 자료', keywords,
    difficulty: avg>75||dens>.35 ? 'DEEP' : avg<32&&dens<.1 ? 'EASY' : 'NORMAL',
    nature: procedural?'procedural':comparative?'comparative':'conceptual',
    purpose: procedural?'절차를 따라 하기':'개념 이해',
    needsSeries: chunks.length>MAX_CONTENT,
  };
}

/* ── 에셋 카탈로그 (FR-17) — 전부 이 파일 안에서 직접 그린 SVG ── */
const ASSET_CATALOG = [
  ['student-character','CHARACTER','학생'],['mentor-character','CHARACTER','선배'],['bot-character','CHARACTER','로봇'],
  ['phone-icon','ICON','전화'],['cpu-icon','ICON','CPU'],['bookmark-icon','ICON','책갈피'],['book-icon','ICON','책'],
  ['lightbulb-icon','ICON','전구'],['clock-icon','ICON','시계'],['question-icon','ICON','물음표'],['check-icon','ICON','체크'],
  ['warning-icon','ICON','주의'],['chart-icon','ICON','도표'],['pencil-icon','ICON','연필'],
  ['desk-bg','BACKGROUND','책상'],['classroom-bg','BACKGROUND','교실'],['cafe-bg','BACKGROUND','카페'],['plain-bg','BACKGROUND','빈 배경'],
].map(([assetId,category,label])=>({assetId,category,label,licenseVerified:true,isPublic:true}));
const ASSET_IDS = ASSET_CATALOG.map(a=>a.assetId);
const ASSET = Object.fromEntries(ASSET_CATALOG.map(a=>[a.assetId,a]));
const DEFAULT_ASSET = {CHARACTER:'student-character',ICON:'lightbulb-icon',BACKGROUND:'plain-bg'};
const guessCategory = id => /character|person|student|teacher|mentor/i.test(id)?'CHARACTER': /bg$|background|scene/i.test(id)?'BACKGROUND':'ICON';
const CHAR_ALIAS = {student:'student-character','학생':'student-character',mentor:'mentor-character',teacher:'mentor-character',professor:'mentor-character',senior:'mentor-character','선배':'mentor-character','선생님':'mentor-character',bot:'bot-character',robot:'bot-character',cpu:'bot-character',computer:'bot-character','로봇':'bot-character'};
function resolveCharacter(name){
  const k = String(name||'').trim().toLowerCase();
  if (ASSET[k] && ASSET[k].category==='CHARACTER') return {assetId:k,known:true};
  return CHAR_ALIAS[k] ? {assetId:CHAR_ALIAS[k],known:true} : {assetId:DEFAULT_ASSET.CHARACTER,known:false};
}
const resolveExpression = e => EXPRESSIONS.includes(e)? e : 'neutral';

/* ── ③ Validator (FR-22~27) ─────────────────────────────────────
   치명 오류(errors) → 재생성 대상. 에셋·출처 문제 → 고쳐서 통과 + 로그. */
const isObj = v => typeof v==='object' && v!==null && !Array.isArray(v);
const isStr = v => typeof v==='string';
const isStrArr = v => Array.isArray(v) && v.every(isStr);
function validateData(raw, at, errors){
  if (raw==null) return undefined;
  if (!isObj(raw)){ errors.push(`${at}.data가 객체가 아닙니다`); return; }
  const side = s => isObj(s) && isStr(s.label) && isStrArr(s.items) && s.items.length>0;
  if (raw.kind==='comparison'){ if (side(raw.left)&&side(raw.right)) return raw; errors.push(`${at}.data(comparison)에는 left/right의 label과 items가 필요합니다`); }
  else if (raw.kind==='steps'){ if (Array.isArray(raw.steps)&&raw.steps.length>=2&&raw.steps.every(s=>isObj(s)&&isStr(s.label))) return raw; errors.push(`${at}.data(steps)에는 steps가 2개 이상 필요합니다`); }
  else if (raw.kind==='points'){ if (isStrArr(raw.items)&&raw.items.length) return raw; errors.push(`${at}.data(points)에는 items가 필요합니다`); }
  else if (raw.kind==='quote'){ if (isStr(raw.quote)&&raw.quote) return raw; errors.push(`${at}.data(quote)에는 quote가 필요합니다`); }
  else errors.push(`${at}.data.kind가 올바르지 않습니다`);
}
function validateDeck(raw, ctx){
  const errors=[], logs=[];
  const log=(kind,detail)=>logs.push({ts:Date.now(),kind,detail});
  if (!isObj(raw)) return {ok:false,errors:['응답이 JSON 객체가 아닙니다'],logs};
  if (raw.schemaVersion!=='1.0') errors.push('schemaVersion은 "1.0"이어야 합니다');
  if (!isStr(raw.title)||!raw.title.trim()) errors.push('title이 없습니다');
  if (!isStr(raw.summary)) errors.push('summary가 없습니다');
  if (!FORMATS.includes(raw.format)) errors.push('format이 올바르지 않습니다');
  if (!isStr(raw.sourceId)) errors.push('sourceId가 없습니다');
  if (!isStrArr(raw.warnings)) errors.push('warnings 배열이 없습니다');
  if (!Array.isArray(raw.cards)) return {ok:false,errors:[...errors,'cards 배열이 없습니다'],logs};
  if (raw.cards.length<1) errors.push('cards에 카드가 한 장도 없습니다'); // 장수는 내용에 따라 달라지므로 고정 범위를 강제하지 않는다
  const warnings = isStrArr(raw.warnings)? [...raw.warnings] : [];
  const cards=[];
  raw.cards.forEach((c,i)=>{
    const at=`cards[${i}]`, n0=errors.length;
    if (!isObj(c)){ errors.push(`${at}가 객체가 아닙니다`); return; }
    if (c.order!==i+1) errors.push(`${at}.order는 ${i+1}이어야 합니다 (1부터 연속)`);
    if (!CARD_TYPES.includes(c.type)) errors.push(`${at}.type이 올바르지 않습니다`);
    if (!CARD_ROLES.includes(c.role)) errors.push(`${at}.role이 올바르지 않습니다`);
    if (!LAYOUTS.includes(c.layout)) errors.push(`${at}.layout이 올바르지 않습니다`);
    if (!isStr(c.title)) errors.push(`${at}.title이 없습니다`);
    if (!isStr(c.body)) errors.push(`${at}.body가 없습니다`);
    if (!Array.isArray(c.panels)) errors.push(`${at}.panels 배열이 없습니다`);
    if (!isStrArr(c.sourceRefs)) errors.push(`${at}.sourceRefs 배열이 없습니다`);
    const v=c.visual;
    if (!isObj(v)||!STRATEGIES.includes(v.strategy)||!isStrArr(v.assetIds)) errors.push(`${at}.visual(strategy, assetIds)가 올바르지 않습니다`);
    if (errors.length>n0) return;
    // FR-24 type·layout·세부 필드 교차 검증
    if (!TYPE_LAYOUTS[c.type].includes(c.layout)) errors.push(`${at}: type "${c.type}"에는 layout ${TYPE_LAYOUTS[c.type].join('|')}만 쓸 수 있습니다`);
    const panels = c.panels.filter(p=>isObj(p)&&isStr(p.scene)&&isStr(p.character)&&isStr(p.expression)&&isStr(p.dialogue));
    if (panels.length!==c.panels.length) errors.push(`${at}.panels의 각 컷에는 scene, character, expression, dialogue가 필요합니다`);
    if ((c.type==='comic'||c.layout==='comic_panels') && (panels.length<2||panels.length>4)) errors.push(`${at}: comic 카드에는 panels가 2~4개 필요합니다 (현재 ${panels.length}개)`);
    const data = validateData(c.data, at, errors);
    if (c.type==='infographic'&&c.layout==='comparison'&&(!data||data.kind!=='comparison')) errors.push(`${at}: comparison 레이아웃에는 data.kind "comparison"이 필요합니다`);
    if (c.layout==='diagram'&&(!data||data.kind!=='steps')) errors.push(`${at}: diagram 레이아웃에는 data.kind "steps"가 필요합니다`);
    let imagePrompt=null;
    if (v.strategy==='generate_image'){
      if (!isStr(v.imagePrompt)||v.imagePrompt.trim().length<10) errors.push(`${at}: generate_image에는 10자 이상의 imagePrompt가 필요합니다`);
      else imagePrompt=v.imagePrompt;
    }
    // FR-25/21 에셋 실존 대조 → 기본 에셋 치환
    const assetIds=[];
    for (const id of v.assetIds){
      let use=id;
      if (!ctx.assetIds.has(id)){ use=DEFAULT_ASSET[guessCategory(id)]; log('missing_asset',`${at}: "${id}" → "${use}"`); }
      if (!assetIds.includes(use)) assetIds.push(use);
    }
    // FR-26 sourceRefs 할루시네이션 차단
    const sourceRefs=[...new Set(c.sourceRefs.filter(r=>ctx.chunkIds.has(r)))];
    const removed=c.sourceRefs.filter(r=>!ctx.chunkIds.has(r));
    if (removed.length){
      log('invalid_source_ref',`${at}: ${removed.join(', ')}`);
      warnings.push(`${i+1}번 카드: 원본에서 확인되지 않는 출처(${removed.join(', ')})를 제거했습니다. 내용 확인이 필요합니다.`);
    }
    const card={order:i+1,type:c.type,role:c.role,title:c.title,body:c.body,layout:c.layout,
      visual:{strategy:v.strategy,description:isStr(v.description)?v.description:'',assetIds,imagePrompt,mood:isStr(v.mood)?v.mood:'calm'},
      panels:panels.map(p=>({scene:p.scene,character:p.character,expression:p.expression,dialogue:p.dialogue})),sourceRefs};
    if (data) card.data=data;
    if (c.supplemental===true||removed.length) card.supplemental=true;
    cards.push(card);
  });
  if (errors.length) return {ok:false,errors,logs};
  const deck={schemaVersion:'1.0',title:raw.title,summary:raw.summary,format:raw.format,sourceId:raw.sourceId,cards,warnings};
  if (isObj(raw.meta)) deck.meta=raw.meta;
  return {ok:true,errors:[],logs,deck};
}

/* ── ② Planner (규칙 기반, FR-07~16) ─────────────────────────────
   이 프로토타입에는 AI가 연결되어 있지 않다. 원문 문장을 고쳐 쓰지 않고
   문장 구조(순서·대조·예시)를 읽어 카드 유형을 고른다. Planner 인터페이스
   {name, plan(ctx), planCard(ctx,deck,order,req)}만 지키면 AI 기획기로 교체할 수 있다. */
const VIS = {
  comic:()=>({strategy:'reuse_asset',assetIds:['student-character','mentor-character'],mood:'playful'}),
  scene:(bg)=>({strategy:'reuse_asset',assetIds:['mentor-character',bg||'desk-bg'],mood:'warm'}),
  reaction:()=>({strategy:'reuse_asset',assetIds:['student-character'],mood:'playful'}),
  infographic:(ic)=>({strategy:'template',assetIds:[ic||'chart-icon'],mood:'informative'}),
  text:()=>({strategy:'none',assetIds:[],mood:'calm'}),
  summary:()=>({strategy:'template',assetIds:['check-icon'],mood:'calm'}),
};
function mk(type, role, layout, title, body, extra={}, visArg){
  const v=VIS[type](visArg);
  return Object.assign({order:0,type,role,title,body,layout,
    visual:{strategy:v.strategy,description:extra.desc||title,assetIds:v.assetIds,imagePrompt:null,mood:v.mood},
    panels:extra.panels||[],sourceRefs:extra.refs||[]}, extra.data?{data:extra.data}:{});
}
const SEQ = /(^|\s)(먼저|우선|첫째|첫 번째로|다음으로|그다음|그 다음|그런 뒤|이후|이어서|둘째|셋째|마지막으로|끝으로)(\s|,)/;
function parseSteps(text){
  const lines=text.split('\n').filter(Boolean);
  const listed=lines.filter(l=>LIST_LINE.test(l));
  if (listed.length>=2) return {lead:lines.filter(l=>!LIST_LINE.test(l)).join(' '),steps:listed.map(l=>({label:l.replace(LIST_LINE,'').trim()}))};
  const s=splitSentences(text);
  if (s.length>=3 && s.filter(x=>SEQ.test(x)).length>=2){
    const first=s.findIndex(x=>SEQ.test(x));
    return {lead:s.slice(0,first).join(' '),steps:s.slice(first).map(x=>({label:x}))};
  }
  return null;
}
const CMP = /^(반면에?|반대로|이와 달리|그와 달리|하지만|그러나)[, ]\s*/;
const subjectOf = s => { const m=s.match(/^([가-힣A-Za-z0-9()·\- ]{1,16}?)(?:은|는|이란|란)\s/); const t=m? m[1].trim() : ''; return t.length>10 || /(하|되|있|없|것)$/.test(t) ? '' : t; };
function parseComparison(text){
  const s=splitSentences(text);
  const i=s.findIndex((x,k)=>k>0 && /^(반면에?|반대로|이와 달리|그와 달리)/.test(x));
  let L,R;
  if (i>0){ L=s.slice(0,i); R=s.slice(i).map((x,k)=>k===0? x.replace(CMP,'') : x); }
  else {
    const one=s.find(x=>/\s반면\s/.test(x)); if (!one||s.length>2) return null;
    const [a,b]=one.split(/,?\s반면\s/); if (!a||!b) return null;
    L=[a.replace(/(지만|는|은)$/,'')]; R=[b];
  }
  const ll=subjectOf(L[0]), rl=subjectOf(R[0]);
  return {kind:'comparison',named:!!(ll&&rl),left:{label:ll||'한편',items:L},right:{label:rl||'반면',items:R}};
}
const EXAMPLE = /예를 들어|예컨대|가령|비유하자면|예로 들면/;
const BGS = ['desk-bg','classroom-bg','cafe-bg'];
const short = (s,n)=> s.length>n ? s.slice(0,n-1).trimEnd()+'…' : s;

/** 묶음(group) → 카드. form을 강제할 수 있다 (인접 레이아웃 회피·부분 수정에 사용) */
function buildCard(g, form, env){
  const sents=splitSentences(g.text);
  const kws=extractKeywords(g.text,2);
  const kwTitle = g.heading || (kws.length? kws.join(' · ') : '핵심 내용');
  const limit = env.prefs.difficulty==='EASY'?1 : env.prefs.difficulty==='DEEP'?99 : 3;
  const rest = (from)=> sents.slice(from, from+limit).join(' ');
  const refs=g.ids, role=g.role||'explanation', bg=BGS[g.n%BGS.length];
  switch(form){
    case 'diagram': { const st=parseSteps(g.text) || (sents.length>=2? {lead:'',steps:sents.map(x=>({label:x}))} : null);
      if (!st) return null;
      return mk('infographic','explanation','diagram', g.heading||`${kws[0]||'과정'} — 순서대로`, st.lead, {refs,data:{kind:'steps',steps:st.steps.slice(0,6)},desc:`${kws[0]||'과정'}의 단계별 순서 다이어그램`}, 'clock-icon'); }
    case 'comparison': { const d=parseComparison(g.text); if (!d) return null;
      const named=d.named; delete d.named;
      return mk('infographic','comparison','comparison', named? `${d.left.label} vs ${d.right.label}` : `${kws[0]||'두 가지'} 비교`, '', {refs,data:d,desc:`${d.left.label}와(과) ${d.right.label}의 비교 도표`}, 'chart-icon'); }
    case 'comic': { if (!sents.length) return null;
      const panels=[{scene:'책상 앞에서 고개를 갸웃하는 학생',character:'student',expression:'thinking',dialogue:`${kws[0]||'이 부분'}… 이건 어떻게 되는 거지?`},
        {scene:'옆에서 설명해 주는 선배',character:'mentor',expression:'happy',dialogue:sents[0]}];

      {scene:'책장을 넘기다 멈춘 학생',character:'student',expression:'confused',dialogue:t[1]},

const localPlanner = {
  name:'local',
  plan: async ctx => planLocal(ctx),
  planCard: async (ctx, deck, order, req) => {
    const card=deck.cards.find(c=>c.order===order); if (!card) return null;
    const byId=Object.fromEntries(ctx.analysis.chunks.map(c=>[c.id,c.text]));
    const text = card.sourceRefs.map(r=>byId[r]).filter(Boolean).join('\n')
      || [card.body, ...card.panels.map(p=>p.dialogue), ...(card.data&&card.data.items||[])].filter(Boolean).join(' ') || card.title;
    const g={ids:card.sourceRefs,text,n:order,role:['hook','conclusion','reaction'].includes(card.role)?'explanation':card.role};
    const env={prefs:ctx.prefs||DEFAULT_PREFS,bias:null};
    const forms={text:['text'],scene:['scene_split','scene_full'],comic:['comic'],reaction:['reaction'],infographic:['diagram','comparison'],summary:['points']}[req.forceType||card.type]||['text'];
    let out=null; for (const f of forms){ out=buildCard(g,f,env); if (out) break; }
    if (!out) return null;

  },
};

/* ── ④ Asset & Visual Resolver (FR-16, 18, 20) ───────────────────
   기획과 분리된 단계. 이미지 생성기가 없으면(=현재) 성공한 척하지 않고 강등한다. */
function resolveAssets(deck, imageGenerator){
  const logs=[];
  const cards=deck.cards.map(card=>{
    if (card.visual.strategy!=='generate_image' || imageGenerator) return card;
    const strategy = card.visual.assetIds.length? 'reuse_asset':'template';
    logs.push({ts:Date.now(),kind:'image_fallback',detail:`${card.order}번 카드: generate_image → ${strategy} (이미지 생성 미연결)`});
    return {...card, visual:{...card.visual,strategy,imagePrompt:null,fallback:'이미지 생성이 연결되지 않아 내장 에셋으로 대체했습니다'}};
  });
  return {deck:{...deck,cards},logs};
}

/* ── 파이프라인: 분석 → 기획 → 검증(재시도) → 에셋 (FR-28) ─────── */
const MAX_RETRY = 2;
function parsePlannerOutput(raw){
  if (!isStr(raw)) return raw;

}
function fallbackDeck(a){ // 원문을 안전하게 나눈 기본 템플릿 덱

  const cards=[mk('text','hook','typography',a.topic,'',{data:{kind:'quote',quote:a.topic}})];
  groups.forEach((g,i)=>cards.push(mk('text',i?'explanation':'context','typography',`${i+1}. ${short(extractKeywords(g.text,2).join(' · ')||'내용',24)}`,g.text,{refs:g.ids.filter(Boolean)})));
  cards.forEach((c,i)=>c.order=i+1);
  return {schemaVersion:'1.0',title:a.topic,summary:'',format:'text_focused',sourceId:a.sourceId,cards,warnings:['자동 구성에 실패해 원문을 나눈 기본 카드로 표시합니다.'],meta:{generator:'fallback'}};

async function generateDeck(source, prefs, planner, opts={}){
  const analysis=analyzeSource(source);
  const vctx={chunkIds:new Set(analysis.chunks.map(c=>c.id)),assetIds:new Set(ASSET_IDS)};
  const logs=[]; let errors=[]; let attempts=0;
  for (let i=0;i<=MAX_RETRY;i++){
    attempts++;

    try {

      res=validateDeck(parsePlannerOutput(raw), vctx);
    } catch(e){ res={ok:false,errors:['JSON 구문 오류: '+(e&&e.message||e)],logs:[]}; }
    logs.push(...res.logs);
    if (res.ok){
      const deck=res.deck; deck.meta={...(deck.meta||{}),generator:(deck.meta&&deck.meta.generator)||planner.name};
      const r=resolveAssets(deck, opts.imageGenerator||null);

    }
    errors=res.errors;
    logs.push({ts:Date.now(),kind:'schema_fail',detail:errors.slice(0,4).join(' / ')});
    if (i<MAX_RETRY) logs.push({ts:Date.now(),kind:'retry',detail:`재생성 ${i+1}/${MAX_RETRY}`});
  }
  logs.push({ts:Date.now(),kind:'final_fallback',detail:errors.slice(0,3).join(' / ')});

  if (!safe.ok) safe=validateDeck(fallbackDeck(analysis), vctx);
  safe.deck.meta={...(safe.deck.meta||{}),generator:'fallback'};
  safe.deck.warnings.push('기획 결과 검증에 실패해 기본 구성으로 대체했습니다.');

function mergeLocked(prev, next, orders){

  const analysis=analyzeSource(source);

  let card;
  if (req.manual) card={...deck.cards.find(c=>c.order===order), ...req.manual};

function adaptDeck(json){
  if (isObj(json) && json.schemaVersion==='1.0' && Array.isArray(json.cards)) return json;
  const raw=isObj(json)?json:{}; const s=v=>isStr(v)?v:'';
  const title=s(raw.title)||'제목 없는 카드';
  const cards=(Array.isArray(raw.cards)?raw.cards:[]).filter(isObj)

  if (!cards.length) cards.push(mk('text','hook','typography',title,s(raw.summary)||s(raw.body)||'내용을 불러오지 못했습니다.'));

const SAMPLE_SOURCES = [
  {id:'source-001',title:'CPU도 일하다가 방해받는다고? — 인터럽트',category:'IT·컴퓨터',ownerId:'sample',createdAt:0,text:
`운영체제 과제를 하던 중에 전화벨이 울리면 우리는 하던 일을 잠시 멈추고 전화를 받는다. 통화가 끝나면 멈췄던 곳으로 돌아와 과제를 이어 간다.

인터럽트(Interrupt)는 CPU가 프로그램을 실행하는 도중 급하게 처리해야 할 일이 생겼을 때, 실행 중인 작업을 잠시 멈추고 그 일을 먼저 처리하도록 알리는 신호다.

인터럽트가 발생하면 CPU는 먼저 현재 작업의 상태(문맥)를 저장한다. 다음으로 인터럽트 서비스 루틴(ISR)을 실행해 요청을 처리한다. 마지막으로 저장해 둔 상태를 복원하고 원래 작업으로 복귀한다.

폴링은 CPU가 장치의 상태를 주기적으로 직접 확인하는 방식이다. 반면 인터럽트는 장치가 필요할 때 CPU에 신호를 보내는 방식이어서, CPU가 확인하느라 시간을 낭비하지 않는다.

`15세기 조선에서 글을 쓴다는 것은 한자를 쓴다는 뜻이었다. 한자는 배우는 데 오랜 시간이 걸려, 생업에 바쁜 백성 대부분은 글을 읽고 쓰지 못했다.

반대도 있었다. 집현전 부제학 최만리 등은 상소를 올려, 한자를 두고 새 글자를 쓰는 것은 옳지 않다고 주장했다. 세종은 뜻을 굽히지 않았다.

자음은 소리를 낼 때의 발음 기관 모양을 본떠 만들었고, 모음은 하늘·땅·사람을 본뜬 세 기호를 조합해 만들었다. 적은 수의 글자를 조합해 많은 소리를 적을 수 있다.

정인지는 해례본 서문에서 "슬기로운 사람은 아침나절이 되기 전에 깨우치고, 어리석은 사람도 열흘이면 배울 수 있다"고 적었다.`},

`햇빛은 흰색으로 보이지만 여러 색의 빛이 섞여 있다. 색마다 파장이 달라서, 파란빛은 파장이 짧고 붉은빛은 파장이 길다.

햇빛이 대기를 지날 때 공기 분자에 부딪혀 사방으로 흩어진다. 이를 레일리 산란이라고 하며, 파장이 짧은 빛일수록 훨씬 강하게 산란된다.

낮에는 햇빛이 대기를 짧게 통과한다. 이때 강하게 흩어진 파란빛이 하늘 전체에서 눈으로 들어와 하늘이 파랗게 보인다.

반면 해가 질 무렵에는 햇빛이 대기를 비스듬히 길게 통과한다. 파란빛은 오는 도중에 대부분 흩어져 버리고, 덜 흩어진 붉은빛이 남아 노을이 붉게 보인다.`},

찬물에 바로 식히면 남은 열로 더 익는 것을 막고 껍데기도 잘 벗겨진다.`},

  // 첫 실행: 추천 예시 콘텐츠를 넣는다. interests가 null이면 관심사 선택 화면부터 시작한다
  S={sources:clone(SAMPLE_SOURCES),decks:[],prefs:{...DEFAULT_PREFS},interests:null,discovery:'some',logs:[]};
  const now=Date.now();

    inner = fn(card, prevLayout===card.layout || card.order%2===0);
  } catch(e){
    pushLogs([{ts:Date.now(),kind:'render_error',detail:`${card&&card.order}번 카드: ${e.message}`}]);
    inner = `<div class="typo"><h3 class="ft sm">${esc(card&&card.title||'카드')}</h3><p class="fp scroll">${esc(card&&card.body||'이 카드를 그리지 못해 기본 형태로 보여 드려요.')}</p></div>`;

  const icons=(card.visual&&card.visual.assetIds||[]).filter(id=>ASSET[id]&&ASSET[id].category==='ICON').slice(0,2).map(id=>icon(id,'ic')).join('');

/* ── 피드·보관함 규칙 (packages/core/src/feed.ts 와 같은 규칙. 전부 규칙 기반이다) ── */
/** 1) 다시 볼 차례인 콘텐츠를 맨 앞에 2) 내 자료와 관심 분야 추천을 번갈아 3) 새 분야를 드문드문 4) 이미 이해한 것은 맨 뒤 */
function buildFeed(decks, interests, opts={}){
  const now=opts.now||Date.now(), every=DISCOVERY_EVERY[opts.discovery||'some'], liked=new Set(interests);
  const newest=(a,b)=>b.createdAt-a.createdAt;
  const pool=decks.filter(d=>d.status!=='ARCHIVED');
  const reasonOf=d=>d.origin==='mine'?'mine':liked.has(d.category)?'interest':'discovery';
  const resurface=pool.filter(d=>isDue(d,now)).sort(newest), rest=pool.filter(d=>!isDue(d,now));
  const seen=rest.filter(d=>d.memory.state==='understood').sort(newest), fresh=rest.filter(d=>d.memory.state!=='understood');
  const mine=fresh.filter(d=>d.origin==='mine').sort(newest);
  const interest=fresh.filter(d=>d.origin!=='mine'&&liked.has(d.category)).sort(newest);
  const discovery=fresh.filter(d=>d.origin!=='mine'&&!liked.has(d.category)).sort(newest);
  const main=[];
  for (let i=0;i<Math.max(mine.length,interest.length);i++){ if (mine[i]) main.push({rec:mine[i],reason:'mine'}); if (interest[i]) main.push({rec:interest[i],reason:'interest'}); }
  const out=resurface.map(rec=>({rec,reason:'resurface'}));
  if (!main.length) out.push(...discovery.map(rec=>({rec,reason:'discovery'})));
  else { let d=0;
    main.forEach((item,i)=>{ out.push(item); if (every&&(i+1)%every===0&&discovery[d]) out.push({rec:discovery[d++],reason:'discovery'}); });
    if (every&&d===0&&discovery[0]) out.push({rec:discovery[0],reason:'discovery'}); }
  out.push(...seen.map(rec=>({rec,reason:reasonOf(rec)})));
  return out;
}
/** 보관함 검색용 태그. 샘플은 지정된 태그를, 내 자료는 원문에서 뽑은 낱말을 쓴다 */
function deckTags(deck, source, limit=4){
  if (deck.meta&&deck.meta.tags&&deck.meta.tags.length) return deck.meta.tags.slice(0,limit);
  return extractKeywords(source? `${source.title} ${source.text}` : deckSearchText(deck), limit);
}
/** 보관함 검색: 제목 · 태그 · 분야 */
function matchesLibrary(rec, deck, tags, query, field='전체'){
  if (field!=='전체'&&rec.category!==field) return false;
  const q=query.trim().toLowerCase(); if (!q) return true;
  return [deck.title,rec.category,...tags].some(s=>String(s).toLowerCase().includes(q));
}
const tagsOf = rec => deckTags(currentDeck(rec), sourceOf(rec));

/* ── 게시물 ── */
/** 게시물 아래쪽: 넘김 표시 · 저장 · 한 줄 설명. 보이는 버튼은 저장 하나뿐이고 나머지는 상세 메뉴에 있다.
    카드를 넘길 때 이 부분만 다시 그린다 */
function postFoot(rec){
  const deck=currentDeck(rec), n=deck.cards.length, i=Math.min(pos(rec.id),n-1), m=rec.memory;
  const note = m.state==='understood'? `이해 완료 · 다음에 만날 날 ${m.nextReviewAt?fmtDate(m.nextReviewAt):''}` : m.state==='review'? '중요 표시 · 피드에서 다시 보여 드려요' : '';
  return `
    <div class="pnav">
      <span class="dots" role="img" aria-label="${n}장 중 ${i+1}번째">${deck.cards.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span>
      <span class="pbtns"><button class="pib" data-act="bookmark" data-id="${rec.id}" aria-pressed="${!!rec.bookmarked}" aria-label="보관함에 저장">${icon('bookmark-icon')}</button></span></div>
    <div class="pdesc">
      ${deck.summary?`<p class="sum">${esc(deck.summary)}</p>`:''}
      ${i===n-1&&m.state==='new'?`<div class="pend"><span>끝까지 봤어요.</span><button class="btn small" data-act="understood" data-id="${rec.id}">이해 완료</button><button class="btn ghost small" data-act="again" data-id="${rec.id}">중요 표시</button></div>`
        : note?`<p class="memo">${note}</p>`:''}
    </div>`;
}
const atOf = (i,n) => n<2? 'only' : i===0? 'first' : i===n-1? 'last' : 'mid';
/** 콘텐츠 한 편 = 화면 하나. 세로로 넘기면 다음 콘텐츠, 가로로 넘기면 다음 카드 */
function post(rec, reason){
  const deck=currentDeck(rec), n=deck.cards.length;
  ui.idx[rec.id]=Math.min(Math.max(0,pos(rec.id)),n-1);
  const p=deck.cards.flatMap(c=>c.panels)[0];
  const avatar = p? charSvg(resolveCharacter(p.character).assetId,'neutral')
    : icon({infographic:'chart-icon',text:'pencil-icon',summary:'check-icon'}[deck.cards[0].type]||'book-icon','tic');
  return `<article class="post" data-post="${rec.id}" aria-label="${esc(deck.title)}, 카드 ${n}장">
    <header class="phead"><span class="pav ${p?'':'ic'}">${avatar}</span>
      <div class="pt"><h2>${esc(deck.title)}</h2><p>${esc(rec.category)} · ${originLabel(rec,deck)} · ${n}장</p></div>
      ${FEED_TAG[reason]?`<span class="tag due">${FEED_TAG[reason]}</span>`:''}</header>
    <div class="pwrap" data-at="${atOf(pos(rec.id),n)}">
      <div class="pgr" data-pgr="${rec.id}" role="group" aria-label="카드. 좌우로 밀어 넘길 수 있어요">
        ${deck.cards.map((c,k)=>`<div class="slide"><div class="fwrap">${renderFace(c,n,rec.category,k?deck.cards[k-1].layout:null)}</div></div>`).join('')}</div>
      <button class="parr l" data-act="go" data-id="${rec.id}" data-v="-1" aria-label="이전 카드">${icon('left')}</button>
      <button class="parr r" data-act="go" data-id="${rec.id}" data-v="1" aria-label="다음 카드">${icon('right')}</button></div>
    <div data-foot="${rec.id}">${postFoot(rec)}</div></article>`;
}

/** 예시 덱 (PDF·링크 처리 시뮬레이션). 실제 자료 내용이 아니다 */
function simulatedDeck(kind, title){

  const V=(strategy,description,assetIds,mood)=>({strategy,description,assetIds,imagePrompt:null,mood});

    meta:{generator:'sample',simulated:kind,tags:['시뮬레이션',kind==='pdf'?'PDF':'링크']},
    cards:[
      {order:1,type:'text',role:'hook',title:'이 카드는 예시입니다',body:`${what}에서 본문을 읽어 오는 기능은 아직 연결되지 않았어요. 연결되면 이 자리에 실제 내용으로 만든 카드가 들어갑니다.`,layout:'typography',visual:V('template','시뮬레이션 안내 타이포그래피',['warning-icon'],'calm'),panels:[],sourceRefs:[]},
      {order:2,type:'infographic',role:'explanation',title:'연결되면 이렇게 처리됩니다',body:'',layout:'diagram',visual:V('template','자료 처리 단계 다이어그램',['clock-icon'],'informative'),panels:[],
        data:{kind:'steps',steps:[{label:kind==='pdf'?'파일에서 글을 추출한다':'페이지 본문을 가져온다'},{label:'주제와 자료 성격을 분석한다'},{label:'주제에 맞는 연출로 카드를 구성한다'},{label:'원문 근거와 형식을 검증한다'}]},sourceRefs:[]},
      {order:3,type:'summary',role:'conclusion',title:'지금 쓸 수 있는 방법',body:'',layout:'typography',visual:V('template','대안 안내 체크리스트',['check-icon'],'calm'),panels:[],
        data:{kind:'points',items:['필요한 부분을 복사해 메모로 붙여 넣는다','메모로 등록하면 실제 내용으로 카드가 만들어진다']},sourceRefs:[]},
    ]};
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
/** 자료 등록: 처리 상태를 단계별로 보여 준다. 메모가 있으면 실제 처리, 없으면(PDF·링크) 시뮬레이션 */
async function runRegistration({kind,title,text,link,category}){
  const sim=!text;
  const first = sim? (kind==='pdf'?'파일에서 글 추출':'페이지 본문 가져오기') : '자료 읽기';
  const steps=[first,'주제·성격 분석','분야에 맞는 연출로 카드 구성','원문 근거·형식 검증'].map(label=>({label,state:'wait'}));
  ui.busy=true; ui.sheet={type:'add',steps,sim,result:''}; render();
  let rec, message;
  for (let i=0;i<steps.length;i++){
    steps[i].state='run'; render(); await wait(sim?650:260);
    if (i===2){
      if (sim){ rec=newRecord(simulatedDeck(kind,title),null,'mine'); rec.category=category; S.decks=[rec,...S.decks]; save(); }
      else { const source={id:uid('source'),title,text,link:link||'',category,createdAt:Date.now(),ownerId:'me'}; S.sources=[...S.sources,source];
        const out=await createFromSource(source); rec=out.rec;
        const n=currentDeck(rec).cards.length;
        message = out.r.usedFallback? `카드 구성 검증에 실패해 기본 구성 ${n}장으로 만들었어요.` : `카드 ${n}장을 만들었어요. 원문 문장을 그대로 배치한 자동 구성이에요.${kind!=='memo'?(kind==='pdf'?' PDF 파일은 읽지 않았고 메모만 사용했습니다.':' 링크는 출처로만 저장했고 메모만 사용했습니다.'):''}`; }
    }
    steps[i].state='done';
  }
  if (sim) message=`시뮬레이션이 끝났어요. ${kind==='pdf'?'PDF':'링크'}의 내용은 읽지 않았고, 예시 카드 ${currentDeck(rec).cards.length}장을 만들었습니다.`;
  ui.busy=false; ui.sheet={type:'add',steps,sim,result:message,resultId:rec.id}; render();
}
async function applyCardEdit(req){
  const id=ui.sheet.id, rec=S.decks.find(r=>r.id===id), deck=currentDeck(rec), order=deck.cards[Math.min(pos(id),deck.cards.length-1)].order;
  const res=await editCard(sourceOf(rec), deck, order, req, S.prefs, localPlanner);
  if (!res.ok){ ui.sheet={...ui.sheet,error:res.errors[0]}; return; }
  pushLogs(res.logs);
  update(id, r=>markDirty(addVersion(r,res.deck,'PARTIAL_EDIT',`${order}번 카드`))); ui.sheet=null;
  say(`${order}번 카드만 수정해 새 버전으로 저장했어요. 다른 카드는 그대로예요.`);
}

  reonboard(){ ui.pick=[...(S.interests||[])]; S.interests=null; save(); ui.sheet=null; ui.viewer=null; },
  tab(d){ ui.tab=d.v; ui.snack=null; ui.viewer=null; render.toTop=true; if (d.v==='feed') refreshFeed(); },
  lcat(d){ ui.lcat=d.v; },
  dismiss(){ ui.snack=null; },
  'close-sheet'(){ if (ui.busy) return false; ui.sheet=null; },
  open(d){ ui.viewer=d.id; ui.idx[d.id]=0; },
  'close-viewer'(){ ui.viewer=null; },
  menu(){ openSheet({type:'menu',id:currentId()}); return false; },
  settings(){ openSheet({type:'settings'}); return false; },
  go(d){ moveCard(d.id,Number(d.v)); return false; },
  bookmark(d){ const on=!S.decks.find(r=>r.id===d.id).bookmarked; update(d.id,r=>({...r,bookmarked:on})); if (!on&&ui.viewer===d.id) ui.viewer=null; say(on?'보관함에 저장했어요.':'보관함에서 뺐어요.'); },
  understood(d){ ui.sheet=null; const now=Date.now(); update(d.id,r=>{ const level=Math.min(3,(r.memory.state==='understood'?r.memory.level:0)+1); return {...r,memory:{state:'understood',level,nextReviewAt:now+[3,7,14,30][level-1]*DAY,at:now}}; }); },
  again(d){ ui.sheet=null; const now=Date.now(); update(d.id,r=>({...r,memory:{state:'review',level:0,nextReviewAt:now+DAY,at:now}})); say('중요 표시했어요. 다음에 피드를 열면 맨 앞에서 다시 보여 드려요.'); },
  add(){ openSheet({type:'add',tab:'memo',category:(S.interests&&S.interests[0])||'기타'}); return false; },
  'add-tab'(d){ keepAddForm({tab:d.v}); },
  'add-cat'(d){ keepAddForm({category:d.v}); },
  'add-done'(){ const id=ui.sheet.resultId; ui.sheet=null; ui.viewer=null; ui.tab='feed'; refreshFeed(id); },
  source(d){ openSheet({type:'source',id:d.id,ref:d.ref||null}); return false; },
  read(d){ openSheet({type:'read',id:d.id}); return false; },
  edit(d){ openSheet({type:'edit',id:d.id}); return false; },
  share(d){ openSheet({type:'share',id:d.id}); return false; },
  'do-share'(d){ update(d.id,r=>({...r,visibility:'shared',syncState:'pending'})); ui.sheet=null; say('공유 대기로 표시했어요. 아직 공유 서버가 연결되지 않아 이 기기에만 있습니다.'); },
  unshare(d){ update(d.id,r=>({...r,visibility:'private',syncState:'local'})); ui.sheet=null; say('공유를 취소했어요. 이 기기에만 있습니다.'); },
  pref(d){ S.prefs[d.k]=d.v; save(); },
  interest(d){ const on=S.interests.includes(d.v); if (on&&S.interests.length===1){ say('관심 분야는 하나 이상 있어야 해요.',true); return; }
    S.interests=on? S.interests.filter(x=>x!==d.v) : [...S.interests,d.v]; save(); refreshFeed(); },
  discovery(d){ S.discovery=d.v; save(); refreshFeed(); },
  'pick-type'(d){ const t=document.getElementById('ctitle'), b=document.getElementById('cbody'); ui.sheet={...ui.sheet,ctype:d.v,ctitle:t?t.value:null,cbody:b?b.value:null,error:null}; },
  async regen(d){
    const id=ui.sheet.id, rec=S.decks.find(r=>r.id===id), src=sourceOf(rec), [label,opts]=REGEN[d.v];
    const r=await generateDeck(src, d.v==='auto'?{...S.prefs,preferredFormat:'auto'}:S.prefs, localPlanner, opts); pushLogs(r.logs);
    update(id, x=>markDirty(addVersion(x, r.deck, 'FULL_REGEN', label))); ui.idx[id]=0; ui.sheet=null;
    say(`‘${label}’로 다시 구성해 v${S.decks.find(x=>x.id===id).currentVersion}로 저장했어요. 메뉴 → 수정 → 버전 기록에서 되돌릴 수 있어요.`);
  },
  async 'card-type'(){ await applyCardEdit({forceType:ui.sheet.ctype}); },
  async 'card-text'(){ await applyCardEdit({manual:{title:document.getElementById('ctitle').value.trim(),body:document.getElementById('cbody').value.trim()}}); },
  rollback(d){ const id=ui.sheet.id; update(id,r=>markDirty(rollback(r,Number(d.v)))); ui.idx[id]=0; ui.sheet=null; say(`v${d.v} 구성을 복원해 새 버전으로 저장했어요.`); },
  async 'next-part'(d){
    const rec=S.decks.find(r=>r.id===d.id), deck=currentDeck(rec), src=sourceOf(rec);
    if (!src||!deck.meta||!deck.meta.series) return;
    const {rec:n}=await createFromSource(src,{chunkOffset:deck.meta.series.nextOffset});
    const nd=currentDeck(n), part=nd.meta&&nd.meta.series? nd.meta.series.part : deck.meta.series.part+1;
    update(n.id,r=>{ const dk=currentDeck(r); dk.title=`${dk.title} (${part}편)`; return {...r,title:dk.title,category:rec.category,versions:[{...r.versions[0],deckJson:dk}]}; });
    ui.sheet=null; ui.viewer=null; ui.tab='feed'; refreshFeed(n.id); say('다음 편을 만들었어요.');
  },
  export(){
    const blob=new Blob([JSON.stringify({app:'morrow',version:2,exportedAt:new Date().toISOString(),sources:S.sources,decks:S.decks,prefs:S.prefs,interests:S.interests,discovery:S.discovery},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='morrow-backup.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    say('백업 파일을 내보냈어요.');
  },
  import(){ document.getElementById('importFile').click(); return false; },
  async 'run-tests'(){ ui.tests=await runAcceptance(); save(); },
};

document.addEventListener('click', async e=>{
  if (e.target.matches&&e.target.matches('[data-scrim]')){ if (!ui.busy){ ui.sheet=null; render(); } return; }
  const el=e.target.closest&&e.target.closest('[data-act]'); if (!el||el.disabled) return;
  const fn=ACT[el.dataset.act]; if (!fn) return;
  const out=await fn(el.dataset, el); if (out!==false) render();
});
// 키보드: ↑↓ 콘텐츠, ←→ 카드, Esc 닫기 (마우스는 휠로 콘텐츠를, 카드 위 화살표로 카드를 넘긴다)
document.addEventListener('keydown', e=>{
  if (e.key==='Escape'){ if (ui.sheet){ if (!ui.busy){ ui.sheet=null; render(); } } else if (ui.viewer){ ui.viewer=null; render(); } return; }
  if (ui.sheet||!S||!S.interests||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const id=currentId();
  if ((e.key==='ArrowLeft'||e.key==='ArrowRight')&&id){ e.preventDefault(); moveCard(id, e.key==='ArrowLeft'?-1:1); }
  else if (ui.tab==='feed'&&!ui.viewer&&['ArrowDown','PageDown','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); moveContent(/Down/.test(e.key)?1:-1); }
});
// 스크롤: 세로는 현재 콘텐츠 위치를 기억하고, 가로는 그 게시물의 아래쪽(넘김 표시)만 다시 그린다
document.addEventListener('scroll', e=>{
  const el=e.target; if (!el||!el.dataset) return;
  if (el.id==='reel'&&el.clientHeight){ ui.at=Math.round(el.scrollTop/el.clientHeight); return; }
  if (!el.dataset.pgr||!el.clientWidth) return;
  const id=el.dataset.pgr, k=Math.round(el.scrollLeft/el.clientWidth); if (k===pos(id)) return;
  const rec=S.decks.find(r=>r.id===id); if (!rec||k<0||k>=currentDeck(rec).cards.length) return;
  ui.idx[id]=k;
  const foot=el.closest('.post').querySelector('[data-foot]'); if (foot) foot.innerHTML=postFoot(rec);
  el.parentNode.dataset.at=atOf(k,currentDeck(rec).cards.length);
}, true);
window.addEventListener('resize', syncScroll);
document.addEventListener('input', e=>{
  const t=e.target;
  if (t.id==='q'){ ui.q=t.value; document.getElementById('list').innerHTML=libraryList(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if (t.id==='pdfFile'&&t.files[0]){ const f=t.files[0]; const form=document.getElementById('addForm');
    keepAddForm({file:f.name}); if (!ui.sheet.title) ui.sheet.title=f.name.replace(/\.[^.]+$/,''); render(); }
  else if (t.id==='importFile'&&t.files[0]){
    const f=t.files[0];
    if (!/\.json$/i.test(f.name)||f.size>2097152){ say('JSON 형식의 2MB 이하 백업 파일만 가져올 수 있어요.',true); render(); return; }
    const rd=new FileReader(); rd.onload=()=>{
      try{ const p=JSON.parse(String(rd.result));
        if (p.app!=='morrow'||!Array.isArray(p.sources)||!Array.isArray(p.decks)) throw new Error('shape');
        const ns=p.sources.filter(s=>s&&isStr(s.id)&&isStr(s.text)&&!S.sources.some(x=>x.id===s.id)).map(s=>({...s,category:toCategory(s.category)}));
        const nd=p.decks.filter(d=>d&&isStr(d.id)&&Array.isArray(d.versions)&&d.memory&&!S.decks.some(x=>x.id===d.id)).map(d=>({...d,category:toCategory(d.category)}));
        S.sources=[...S.sources,...ns]; S.decks=[...S.decks,...nd]; save(); refreshFeed();
        say(`자료 ${ns.length}개, 카드 ${nd.length}개를 가져왔어요. 이미 있던 항목은 그대로 두었습니다.`);
      }catch(err){ say('모로우 백업 파일이 아니거나 내용이 손상되어 가져오지 못했어요. 기존 자료는 그대로입니다.',true); }
      render();
    }; rd.readAsText(f);
  }
});
document.addEventListener('submit', async e=>{
  if (e.target.id!=='addForm') return; e.preventDefault();
  if (ui.busy) return;
  const kind=ui.sheet.tab||'memo', fd=new FormData(e.target), title=String(fd.get('title')).trim(), text=String(fd.get('text')).trim(), link=String(fd.get('link')||'').trim();
  const fail=error=>{ ui.sheet={...ui.sheet,title,text,link,error}; render(); };
  if (!title) return fail('제목을 넣어 주세요.');
  if (kind==='memo'&&text.length<20) return fail('메모가 너무 짧아요. 20자 이상 넣어 주세요.');
  if (kind!=='memo'&&text&&text.length<20) return fail('메모를 넣으려면 20자 이상 넣어 주세요. 비워 두면 시뮬레이션으로 진행합니다.');
  if (kind==='link'&&!/^https?:\/\/\S+$/i.test(link)) return fail('http:// 또는 https:// 로 시작하는 링크를 넣어 주세요.');
  if (kind==='pdf'&&!ui.sheet.file&&!text) return fail('PDF 파일을 고르거나 메모를 넣어 주세요.');
  await runRegistration({kind,title,text,link:kind==='link'?link:'',category:ui.sheet.category||'기타'});
});

/* ── 인수 테스트 (plan.md §9) ─────────────────────────────────── */
async function runAcceptance(){
  const out=[]; const t=async(id,name,fn)=>{ try{ const note=await fn(); out.push({id,name,pass:true,note:note||''}); }catch(e){ out.push({id,name,pass:false,note:e.message}); } };
  const ok=(c,m)=>{ if(!c) throw new Error(m); };
  const src=SAMPLE_SOURCES[0], mkSrc=(text,title='테스트')=>({id:'source-t',title,text,category:'기타',ownerId:'me',createdAt:0});
  const vctx=s=>{ const a=analyzeSource(s); return {chunkIds:new Set(a.chunks.map(c=>c.id)),assetIds:new Set(ASSET_IDS)}; };
  const host=document.createElement('div');
  await t('AT-01','인터럽트 자료 → 웹툰+인포그래픽 혼합',async()=>{ const r=await generateDeck(src,DEFAULT_PREFS,localPlanner); const ty=r.deck.cards.map(c=>c.type); ok(ty.includes('comic')&&ty.includes('infographic'),'혼합되지 않음'); return ty.join(', '); });
  await t('AT-02','웹툰 카드: 2컷 이상 프레임·표정·말풍선 DOM',async()=>{ const c=SAMPLE_INTERRUPT_DECK.cards[0]; host.innerHTML=renderFace(c,7,'공부'); ok(host.querySelectorAll('[data-panel]').length>=2,'컷 부족'); ok(host.querySelectorAll('.bubble').length>=2&&host.querySelector('.bubble').textContent.includes('과제'),'말풍선 텍스트 없음'); ok(host.querySelector('svg[role=img]'),'캐릭터 없음'); });
  await t('AT-03','리액션 카드가 글 카드와 다른 화면',async()=>{ host.innerHTML=renderFace(SAMPLE_INTERRUPT_DECK.cards[3],7,'공부'); ok(host.querySelector('.react .close')&&host.querySelector('.lines'),'리액션 전용 요소 없음'); const a=host.innerHTML; host.innerHTML=renderFace(adaptDeck(LEGACY_SAMPLE).cards[1],3,'공부'); ok(!host.querySelector('.react')&&a!==host.innerHTML,'구분 안 됨'); });
  await t('AT-04','방대한 자료: 한 편에 몰지 않고 분할 제안',async()=>{ const long=Array.from({length:40},(_,i)=>`${i+1}장. 이 장에서는 중요한 개념을 설명한다. 내용이 꽤 길게 이어진다.`).join('\n\n'); const {deck}=await generateDeck(mkSrc(long),DEFAULT_PREFS,localPlanner); ok(deck.cards.length>=2&&deck.cards.length<=13,'카드 수 위반'); ok(deck.meta.series&&deck.meta.series.remainingChunks>0,'분할 제안 없음'); return `${deck.cards.length}장, 남은 문단 ${deck.meta.series.remainingChunks}`; });
  await t('AT-05','무옵션 생성: 입력은 자료뿐',async()=>{ const r=await generateDeck(mkSrc('짧은 메모 하나. 그리고 문장 하나 더.\n\n두 번째 문단이다. 여기에도 문장이 있다.'),DEFAULT_PREFS,localPlanner); ok(r.deck.cards.length>=2,'생성 실패'); });
  await t('AT-06','이미지 생성 미연결: 강등 + 상태 명시',async()=>{ const d=clone(SAMPLE_INTERRUPT_DECK); d.cards[0].visual.strategy='generate_image'; d.cards[0].visual.imagePrompt='a student at a desk, line art'; const r=resolveAssets(validateDeck(d,vctx(src)).deck,null); ok(r.deck.cards[0].visual.strategy==='reuse_asset'&&r.deck.cards[0].visual.fallback,'강등 안 됨'); host.innerHTML=renderFace(r.deck.cards[0],7,'공부'); ok(host.querySelector('.fallback-note')&&host.querySelectorAll('[data-panel]').length>=2,'대체 렌더 실패'); });
  await t('AT-07','비정상 JSON·미등록 에셋 → 재시도/폴백, 화면 유지',async()=>{ let n=0; const flaky={name:'claude',plan:async c=>(++n<3?'{ broken':planLocal(c)),planCard:async()=>null}; const r1=await generateDeck(src,DEFAULT_PREFS,flaky); ok(n===3&&!r1.usedFallback,'재시도 복구 실패');
    const r2=await generateDeck(src,DEFAULT_PREFS,{name:'claude',plan:async()=>({cards:'x'}),planCard:async()=>null}); ok(r2.usedFallback&&r2.deck.cards.length>=2&&r2.logs.some(l=>l.kind==='final_fallback'),'폴백 실패');
    const d=clone(SAMPLE_INTERRUPT_DECK); d.cards[0].visual.assetIds=['dragon-character','ufo-icon']; const v=validateDeck(d,vctx(src)); ok(v.ok&&v.deck.cards[0].visual.assetIds.join()==='student-character,lightbulb-icon'&&v.logs.length===2,'에셋 치환 실패');
    host.innerHTML=renderFace({order:1,type:'nope',title:'깨진 카드',body:'',visual:null},1,'공부'); ok(host.querySelector('.face'),'렌더러 중단'); return `시도 ${r1.attempts}회 후 복구`; });
  await t('AT-08','지어낸 sourceRefs 100% 차단',async()=>{ const d=clone(SAMPLE_INTERRUPT_DECK); d.cards.forEach(c=>c.sourceRefs.push('source-999-p42')); const v=validateDeck(d,vctx(src)); ok(v.ok&&v.deck.cards.every(c=>!c.sourceRefs.includes('source-999-p42')),'차단 실패'); ok(v.deck.cards.every(c=>c.supplemental)&&v.deck.warnings.length===7,'경고 누락'); });
  await t('AT-09','3번 카드만 수정 · 나머지 보존 · 복원',async()=>{ const {deck}=await generateDeck(src,DEFAULT_PREFS,localPlanner); const before=clone(deck); let rec=newRecord(deck,src,'mine'); const e=await editCard(src,deck,3,{forceType:'text'},DEFAULT_PREFS,localPlanner); ok(e.ok&&e.deck.cards[2].type==='text','수정 실패'); ok(e.deck.cards.every((c,i)=>i===2||JSON.stringify(c)===JSON.stringify(before.cards[i])),'다른 카드가 바뀜'); rec=addVersion(rec,e.deck,'PARTIAL_EDIT'); rec=rollback(rec,1); ok(rec.versions.length===3&&JSON.stringify(currentDeck(rec))===JSON.stringify(before),'복원 실패'); });
  await t('AT-10','구버전 카드 열람 · 검색 회귀 없음',async()=>{ const d=adaptDeck(LEGACY_SAMPLE); ok(d.cards.length===3&&d.cards.every(c=>c.type==='text'&&c.layout==='typography'),'매핑 실패'); host.innerHTML=d.cards.map(c=>renderFace(c,3,'발견')).join(''); ok(host.querySelectorAll('.face').length===3,'렌더 실패'); ok(deckSearchText(d).includes('구체적으로'),'검색 실패'); ok(adaptDeck(null).cards.length===1,'깨진 데이터 처리 실패'); });
  await t('AT-11','주제별 샘플: 검증 통과 · 장수와 연출이 분야마다 다름',async()=>{ const made=BUILTIN_SAMPLES.filter(x=>x[1]).map(([si,d])=>[SAMPLE_SOURCES[si],d]);
    made.forEach(([sr,d])=>{ const v=validateDeck(clone(d),vctx(sr)); ok(v.ok&&!v.deck.warnings.length, d.title+': '+((v.errors||[])[0]||v.deck.warnings[0])); });
    const ns=made.map(x=>x[1].cards.length); ok(new Set(ns).size>=3,'장수가 획일적'); const ty=f=>made.find(x=>x[0].category===f)[1].cards.map(c=>c.type);
    ok(ty('역사').filter(x=>x==='comic'||x==='scene').length>=3&&ty('과학').filter(x=>x==='infographic').length>=3&&ty('생활정보')[0]==='infographic','분야별 연출 아님'); return ns.join('·')+'장'; });
  await t('AT-12','혼합 피드: 내 자료·추천 섞기 · 새 분야 · 재노출',async()=>{ const r=(id,category,origin,createdAt,memory)=>({...newRecord(SAMPLE_INTERRUPT_DECK,{id:'s',category},origin,createdAt),id,...(memory?{memory}:{})});
    const f=buildFeed([r('m1','기타','mine',5),r('h1','역사','sample',3),r('s1','과학','sample',1),r('due','역사','sample',0,{state:'review',level:0,nextReviewAt:9e15,at:1}),r('done','역사','sample',9,{state:'understood',level:1,nextReviewAt:9e15,at:1})],['역사'],{now:100,discovery:'often'});
    ok(f.map(x=>x.rec.id).join()==='due,m1,h1,s1,done','순서: '+f.map(x=>x.rec.id).join()); ok(f.map(x=>x.reason).join()==='resurface,mine,interest,discovery,interest','이유: '+f.map(x=>x.reason).join()); });
  await t('AT-13','가변 장수: 1장·14장 덱도 검증 통과, 빈 덱만 거부',async()=>{ const one=clone(SAMPLE_INTERRUPT_DECK); one.cards=[{...one.cards[1],order:1}]; ok(validateDeck(one,vctx(src)).ok,'1장 거부됨');
    const big=clone(SAMPLE_INTERRUPT_DECK); big.cards=Array.from({length:14},(_,i)=>({...clone(big.cards[i%2?1:6]),order:i+1})); ok(validateDeck(big,vctx(src)).ok,'14장 거부됨');
    const none=clone(SAMPLE_INTERRUPT_DECK); none.cards=[]; ok(!validateDeck(none,vctx(src)).ok,'빈 덱 통과'); });
  return out;
}
